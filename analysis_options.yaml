# Analisis statis Mealora.
#
# Batas lapisan (domain tidak mengimpor Flutter/Drift/jaringan, tidak ada
# nilai warna/ukuran font harfiah di luar berkas token, tidak ada pemanggilan
# jam/pembangkit ID acak langsung) ditegakkan oleh uji arsitektur di
# test/unit/architecture/ karena analyzer Dart tidak punya aturan larangan
# impor bawaan. Uji itu ikut di gate `flutter test`.

include: package:flutter_lints/flutter.yaml

analyzer:
  exclude:
    - "**/*.g.dart"
    - "**/*.freezed.dart"
    - "lib/l10n/generated/**"
  language:
    strict-casts: true
    strict-inference: true
    strict-raw-types: true
  errors:
    avoid_print: error
    always_use_package_imports: error
    missing_required_param: error
    missing_return: error
    todo: ignore

linter:
  rules:
    - always_declare_return_types
    - always_use_package_imports
    - avoid_dynamic_calls
    - avoid_print
    - avoid_slow_async_io
    - cancel_subscriptions
    - close_sinks
    - comment_references
    - directives_ordering
    - omit_local_variable_types
    - prefer_const_constructors
    - prefer_const_declarations
    - prefer_final_locals
    - prefer_single_quotes
    - require_trailing_commas
    - sort_constructors_first
    - test_types_in_equals
    - throw_in_finally
    - unawaited_futures
    - unnecessary_parenthesis
    - unnecessary_statements
    - use_enums
    - use_super_parameters
